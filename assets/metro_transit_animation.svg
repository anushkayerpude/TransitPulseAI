<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 150" width="100%" height="150">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050C1A" />
      <stop offset="50%" stop-color="#0A192F" />
      <stop offset="100%" stop-color="#071224" />
    </linearGradient>

    <!-- Glowing Rail Gradient -->
    <linearGradient id="railGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0D9488" stop-opacity="0.3" />
      <stop offset="25%" stop-color="#14B8A6" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="1" />
      <stop offset="75%" stop-color="#14B8A6" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0D9488" stop-opacity="0.3" />
    </linearGradient>

    <!-- Train Body Gradient -->
    <linearGradient id="trainBodyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F2847" />
      <stop offset="40%" stop-color="#1E3E62" />
      <stop offset="85%" stop-color="#2D5A88" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Headlight Beam Gradient -->
    <linearGradient id="headlightBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#38BDF8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </linearGradient>

    <!-- Pulse Glow Filter -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes moveTrain {
      0% { transform: translateX(-240px); }
      100% { transform: translateX(1020px); }
    }
    @keyframes moveOppositeTrain {
      0% { transform: translateX(1020px); }
      100% { transform: translateX(-240px); }
    }
    @keyframes pulseRing {
      0% { r: 4px; opacity: 0.9; }
      50% { r: 14px; opacity: 0; }
      100% { r: 4px; opacity: 0.9; }
    }
    @keyframes signalBlink {
      0%, 100% { opacity: 1; filter: drop-shadow(0 0 6px #10B981); }
      50% { opacity: 0.25; filter: none; }
    }
    @keyframes pulseWave {
      0% { stroke-dashoffset: 600; }
      100% { stroke-dashoffset: 0; }
    }
    .train-group {
      animation: moveTrain 7.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    .signal-led {
      animation: signalBlink 1.4s ease-in-out infinite;
    }
    .pulse-node {
      animation: pulseRing 2.4s ease-out infinite;
      transform-origin: center;
    }
    .live-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      font-size: 10px;
      letter-spacing: 1.2px;
      font-weight: 700;
    }
  </style>

  <!-- Background Canvas -->
  <rect width="960" height="150" rx="12" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="1.5" />

  <!-- Grid Tech Lines -->
  <line x1="20" y1="36" x2="940" y2="36" stroke="#1E293B" stroke-width="1" stroke-dasharray="4 6" />
  <line x1="20" y1="126" x2="940" y2="126" stroke="#1E293B" stroke-width="1" stroke-dasharray="4 6" />

  <!-- Top Telemetry Status Header -->
  <g transform="translate(24, 24)">
    <!-- Signal Live Indicator -->
    <circle cx="6" cy="0" r="4.5" fill="#10B981" class="signal-led" filter="url(#softGlow)">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.4s" repeatCount="indefinite" />
    </circle>
    <text x="18" y="3.5" fill="#14B8A6" class="live-text">GMRC METRO REAL-TIME CORRIDOR MONITOR</text>
    <text x="325" y="3.5" fill="#64748B" class="live-text">•</text>
    <text x="340" y="3.5" fill="#94A3B8" class="live-text">EAST-WEST LINE (THALTEJ ⇄ VASTRAL GAM)</text>
    
    <!-- Right Telemetry Readout -->
    <text x="740" y="3.5" fill="#38BDF8" class="live-text" text-anchor="end">SIGNAL INTERLOCKING: ACTIVE</text>
    <text x="755" y="3.5" fill="#64748B" class="live-text">•</text>
    <text x="770" y="3.5" fill="#F59E0B" class="live-text">HEADWAY: 3.2m</text>
  </g>

  <!-- Track Bed & Sleepers (Ties) -->
  <g stroke="#1E293B" stroke-width="2" opacity="0.6">
    <line x1="40" y1="84" x2="40" y2="98" />
    <line x1="80" y1="84" x2="80" y2="98" />
    <line x1="120" y1="84" x2="120" y2="98" />
    <line x1="160" y1="84" x2="160" y2="98" />
    <line x1="200" y1="84" x2="200" y2="98" />
    <line x1="240" y1="84" x2="240" y2="98" />
    <line x1="280" y1="84" x2="280" y2="98" />
    <line x1="320" y1="84" x2="320" y2="98" />
    <line x1="360" y1="84" x2="360" y2="98" />
    <line x1="400" y1="84" x2="400" y2="98" />
    <line x1="440" y1="84" x2="440" y2="98" />
    <line x1="480" y1="84" x2="480" y2="98" />
    <line x1="520" y1="84" x2="520" y2="98" />
    <line x1="560" y1="84" x2="560" y2="98" />
    <line x1="600" y1="84" x2="600" y2="98" />
    <line x1="640" y1="84" x2="640" y2="98" />
    <line x1="680" y1="84" x2="680" y2="98" />
    <line x1="720" y1="84" x2="720" y2="98" />
    <line x1="760" y1="84" x2="760" y2="98" />
    <line x1="800" y1="84" x2="800" y2="98" />
    <line x1="840" y1="84" x2="840" y2="98" />
    <line x1="880" y1="84" x2="880" y2="98" />
    <line x1="920" y1="84" x2="920" y2="98" />
  </g>

  <!-- Dual Glowing Rails -->
  <line x1="30" y1="86" x2="930" y2="86" stroke="#0F2B48" stroke-width="3" />
  <line x1="30" y1="96" x2="930" y2="96" stroke="#0F2B48" stroke-width="3" />
  <line x1="30" y1="91" x2="930" y2="91" stroke="url(#railGrad)" stroke-width="2.5" filter="url(#softGlow)" />

  <!-- High-Tech Stations / Corridor Nodes -->
  <!-- Station 1: Thaltej -->
  <g transform="translate(100, 91)">
    <circle cx="0" cy="0" r="10" fill="none" stroke="#14B8A6" stroke-width="1.2" opacity="0.4">
      <animate attributeName="r" values="6;16;6" dur="2.8s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.7;0;0.7" dur="2.8s" repeatCount="indefinite" />
    </circle>
    <circle cx="0" cy="0" r="5" fill="#0A192F" stroke="#14B8A6" stroke-width="2.5" />
    <circle cx="0" cy="0" r="2" fill="#38BDF8" />
    <text x="0" y="24" fill="#E2E8F0" font-family="-apple-system, sans-serif" font-size="9.5" font-weight="600" text-anchor="middle">Thaltej</text>
  </g>

  <!-- Station 2: Commerce Six Road -->
  <g transform="translate(300, 91)">
    <circle cx="0" cy="0" r="10" fill="none" stroke="#38BDF8" stroke-width="1.2" opacity="0.4">
      <animate attributeName="r" values="6;16;6" dur="2.8s" begin="0.7s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.7;0;0.7" dur="2.8s" begin="0.7s" repeatCount="indefinite" />
    </circle>
    <circle cx="0" cy="0" r="5" fill="#0A192F" stroke="#38BDF8" stroke-width="2.5" />
    <circle cx="0" cy="0" r="2" fill="#38BDF8" />
    <text x="0" y="24" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="9" text-anchor="middle">Commerce Six Road</text>
  </g>

  <!-- Station 3: Old High Court (Interchange) -->
  <g transform="translate(500, 91)">
    <circle cx="0" cy="0" r="12" fill="none" stroke="#F59E0B" stroke-width="1.5" opacity="0.5">
      <animate attributeName="r" values="7;20;7" dur="2.5s" begin="1.4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.8;0;0.8" dur="2.5s" begin="1.4s" repeatCount="indefinite" />
    </circle>
    <circle cx="0" cy="0" r="6" fill="#0A192F" stroke="#F59E0B" stroke-width="2.5" />
    <circle cx="0" cy="0" r="2.5" fill="#F59E0B" />
    <text x="0" y="24" fill="#FBBF24" font-family="-apple-system, sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">Old High Court 🔄</text>
  </g>

  <!-- Station 4: Kalupur Railway Station -->
  <g transform="translate(700, 91)">
    <circle cx="0" cy="0" r="10" fill="none" stroke="#38BDF8" stroke-width="1.2" opacity="0.4">
      <animate attributeName="r" values="6;16;6" dur="2.8s" begin="2.1s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.7;0;0.7" dur="2.8s" begin="2.1s" repeatCount="indefinite" />
    </circle>
    <circle cx="0" cy="0" r="5" fill="#0A192F" stroke="#38BDF8" stroke-width="2.5" />
    <circle cx="0" cy="0" r="2" fill="#38BDF8" />
    <text x="0" y="24" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="9" text-anchor="middle">Kalupur Rly Stn</text>
  </g>

  <!-- Station 5: Vastral Gam -->
  <g transform="translate(860, 91)">
    <circle cx="0" cy="0" r="10" fill="none" stroke="#14B8A6" stroke-width="1.2" opacity="0.4">
      <animate attributeName="r" values="6;16;6" dur="2.8s" begin="0.3s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.7;0;0.7" dur="2.8s" begin="0.3s" repeatCount="indefinite" />
    </circle>
    <circle cx="0" cy="0" r="5" fill="#0A192F" stroke="#14B8A6" stroke-width="2.5" />
    <circle cx="0" cy="0" r="2" fill="#14B8A6" />
    <text x="0" y="24" fill="#E2E8F0" font-family="-apple-system, sans-serif" font-size="9.5" font-weight="600" text-anchor="middle">Vastral Gam</text>
  </g>

  <!-- ANIMATED METRO TRAIN WITH FORWARD HEADLIGHT BEAM -->
  <g class="train-group">
    <!-- SMIL Fallback Translation for strict environments -->
    <animateTransform 
      attributeName="transform" 
      type="translate" 
      from="-240, 0" 
      to="1020, 0" 
      dur="7.5s" 
      repeatCount="indefinite" 
      calcMode="linear" 
    />

    <!-- Forward Headlight Projection Beam -->
    <polygon points="175,91 290,75 290,107" fill="url(#headlightBeam)" />

    <!-- Trailing Pulse Ripple (Motion Blur) -->
    <rect x="-35" y="81" width="35" height="18" rx="4" fill="#14B8A6" opacity="0.2" filter="url(#neonGlow)">
      <animate attributeName="opacity" values="0.1;0.4;0.1" dur="0.8s" repeatCount="indefinite" />
    </rect>

    <!-- Train Body: Sleek Aerodynamic 3-Carriage High Speed Rake -->
    <!-- Carriage 3 (Rear) -->
    <rect x="0" y="80" width="46" height="20" rx="3" fill="url(#trainBodyGrad)" stroke="#38BDF8" stroke-width="1" />
    <rect x="5" y="83" width="9" height="7" rx="1.5" fill="#E0F2FE" opacity="0.9" filter="url(#softGlow)" />
    <rect x="18" y="83" width="9" height="7" rx="1.5" fill="#E0F2FE" opacity="0.9" filter="url(#softGlow)" />
    <rect x="31" y="83" width="9" height="7" rx="1.5" fill="#E0F2FE" opacity="0.9" filter="url(#softGlow)" />
    <rect x="0" y="96" width="46" height="3" fill="#14B8A6" />

    <!-- Coupler -->
    <rect x="46" y="88" width="5" height="4" fill="#475569" />

    <!-- Carriage 2 (Middle) -->
    <rect x="51" y="80" width="52" height="20" rx="3" fill="url(#trainBodyGrad)" stroke="#38BDF8" stroke-width="1" />
    <rect x="57" y="83" width="9" height="7" rx="1.5" fill="#E0F2FE" opacity="0.9" filter="url(#softGlow)" />
    <rect x="70" y="83" width="9" height="7" rx="1.5" fill="#E0F2FE" opacity="0.9" filter="url(#softGlow)" />
    <rect x="83" y="83" width="9" height="7" rx="1.5" fill="#E0F2FE" opacity="0.9" filter="url(#softGlow)" />
    <rect x="51" y="96" width="52" height="3" fill="#14B8A6" />

    <!-- Coupler -->
    <rect x="103" y="88" width="5" height="4" fill="#475569" />

    <!-- Carriage 1 (Lead Locomotive / Cab with Aerodynamic Nose) -->
    <path d="M 108 80 L 158 80 Q 174 84 176 91 Q 174 98 158 100 L 108 100 Z" fill="url(#trainBodyGrad)" stroke="#38BDF8" stroke-width="1" />
    <!-- Cab Windshield -->
    <path d="M 152 82 L 165 84 Q 169 88 165 92 L 152 92 Z" fill="#38BDF8" filter="url(#softGlow)" />
    <!-- Passenger Windows -->
    <rect x="114" y="83" width="9" height="7" rx="1.5" fill="#E0F2FE" opacity="0.9" filter="url(#softGlow)" />
    <rect x="127" y="83" width="9" height="7" rx="1.5" fill="#E0F2FE" opacity="0.9" filter="url(#softGlow)" />
    <rect x="140" y="83" width="8" height="7" rx="1.5" fill="#E0F2FE" opacity="0.9" filter="url(#softGlow)" />
    <!-- Speed Stripe -->
    <path d="M 108 96 L 162 96 Q 168 96.5 170 98 L 108 98 Z" fill="#14B8A6" />
    
    <!-- Ultra Bright Twin LED Headlights -->
    <circle cx="174" cy="89" r="2.2" fill="#FFFFFF" filter="url(#neonGlow)" />
    <circle cx="174" cy="93" r="2.2" fill="#FFFFFF" filter="url(#neonGlow)" />
    
    <!-- Train Bogies / Wheels (Subtle) -->
    <circle cx="16" cy="101" r="3" fill="#0B132B" stroke="#64748B" stroke-width="1.5" />
    <circle cx="34" cy="101" r="3" fill="#0B132B" stroke="#64748B" stroke-width="1.5" />
    <circle cx="67" cy="101" r="3" fill="#0B132B" stroke="#64748B" stroke-width="1.5" />
    <circle cx="89" cy="101" r="3" fill="#0B132B" stroke="#64748B" stroke-width="1.5" />
    <circle cx="124" cy="101" r="3" fill="#0B132B" stroke="#64748B" stroke-width="1.5" />
    <circle cx="148" cy="101" r="3" fill="#0B132B" stroke="#64748B" stroke-width="1.5" />
  </g>

  <!-- Bottom Pulse Cardiogram / Heartbeat Wave -->
  <g transform="translate(0, 136)" opacity="0.75">
    <path d="M 20 0 L 260 0 L 275 -8 L 290 8 L 305 -12 L 320 10 L 330 0 L 580 0 L 595 -8 L 610 8 L 625 -12 L 640 10 L 650 0 L 940 0" 
          fill="none" 
          stroke="#14B8A6" 
          stroke-width="1.5" 
          stroke-dasharray="8 6" />
    <circle cx="320" cy="0" r="3" fill="#38BDF8" filter="url(#softGlow)">
      <animate attributeName="cx" values="30;930;30" dur="10s" repeatCount="indefinite" />
    </circle>
  </g>
</svg>
